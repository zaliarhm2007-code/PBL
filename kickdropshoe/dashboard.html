<!DOCTYPE html><html lang='id'><head><title>Dashboard Operasional</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        brand: {
                            navy: '#0B1325',
                            darkCard: '#0F172A',
                            darkInput: '#1E293B',
                            yellow: '#FACC15',
                            yellowHover: '#EAB308',
                            slateBg: '#F8FAFC'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head><body class='font-sans antialiased'>
<div class="flex h-screen overflow-hidden bg-brand-slateBg">
    
    <aside class="w-[280px] bg-brand-navy text-slate-300 flex flex-col justify-between shadow-xl shrink-0 z-20 h-screen">
        <div>
            <!-- Brand Header -->
            <div class="p-6 border-b border-slate-800/60 flex items-center gap-3">
              <img src="assets/logo.png" alt="Logo" class="w-10 h-10 rounded-full shadow-md border-2 border-slate-900 object-cover bg-white">
                <div>
                    <h1 class="text-base font-extrabold tracking-tight text-white leading-none">KICKDROPSHOE</h1>
                    <p class="text-[10px] text-brand-yellow font-bold uppercase tracking-widest mt-1">KARYAWAN</p>
                </div>
            </div>
            <!-- Navigation Links -->
            <nav class="p-4 space-y-2">
                
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-slate-800 text-white font-extrabold transition-all">
                    <i class="fas fa-pie-chart w-5"></i> Dashboard
                </a>
            <a href="edit_pesanan.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-400 hover:text-white font-bold transition-all">
                <i class="fas fa-plus w-5"></i> Tambah Pesanan
            </a>
            <a href="pesanan.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-400 hover:text-white font-bold transition-all">
                <i class="fas fa-list-ul w-5"></i> Daftar Pesanan
            </a>
            <a href="akun.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-400 hover:text-white font-bold transition-all">
                <i class="fas fa-user w-5"></i> Profil Akun
            </a>
            </nav>
        </div>

        <!-- User Profile Pill at Bottom -->
        <div class="p-4 border-t border-slate-800/60 m-4 bg-slate-800/40 rounded-2xl">
            <div class="flex items-center gap-3 mb-3">
                <div class="w-9 h-9 bg-brand-yellow text-slate-900 font-extrabold rounded-full flex items-center justify-center text-xs shadow-sm">
                    SA
                </div>
                <div>
                    <p class="text-xs font-extrabold text-white leading-tight">Super Admin</p>
                    <p class="text-[10px] text-emerald-400 font-semibold">Online</p>
                </div>
            </div>
            <a href="login.html" class="flex items-center justify-center gap-2 w-full py-2 bg-slate-800/80 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold transition-all border border-slate-700/50">
                <i class="fas fa-sign-out-alt"></i> Keluar
            </a>
        </div>
    </aside>
    

    <main class="flex-1 flex flex-col h-full overflow-y-auto">
        <!-- Header -->
        <header class="bg-white border-b border-slate-200 px-8 py-5 flex justify-between items-center sticky top-0 z-10">
            <h2 class="text-xl font-extrabold text-slate-900 tracking-tight">Dashboard Operasional</h2>
            <div class="bg-slate-100 px-4 py-2 rounded-full border border-slate-200 text-xs font-bold text-slate-600 flex items-center gap-2">
                <i class="far fa-calendar"></i> 17 Sep 2026
            </div>
        </header>

        <!-- Main Body -->
        <div class="p-8 max-w-7xl mx-auto w-full space-y-6">
            
            <!-- Stat Card 1: PESANAN AKTIF -->
            <div class="bg-white rounded-3xl border border-slate-200 p-8 shadow-sm">
                <p class="text-xs font-extrabold text-slate-400 uppercase tracking-wider mb-2">PESANAN AKTIF</p>
                <h3 class="text-5xl font-black text-slate-900">12</h3>
            </div>

            <!-- Card 2: Pesanan Perlu Perhatian -->
            <div class="bg-white rounded-3xl border border-slate-200 p-8 shadow-sm">
                <h3 class="text-sm font-extrabold text-slate-800 tracking-tight mb-6">Pesanan Perlu Perhatian</h3>
                
                <div class="space-y-4">
                    <!-- Item 1 -->
                    <div class="flex justify-between items-center p-5 bg-slate-50/80 rounded-2xl border border-slate-100">
                        <div>
                            <h4 class="font-extrabold text-slate-900 text-base">#0881 – Budi</h4>
                            <p class="text-xs font-semibold text-slate-400 mt-0.5">Express (Sisa 1 Hari)</p>
                        </div>
                        <a href="pesanan.html" class="text-xs font-extrabold text-brand-yellowHover hover:underline">Cek</a>
                    </div>

                    <!-- Item 2 -->
                    <div class="flex justify-between items-center p-5 bg-slate-50/80 rounded-2xl border border-slate-100">
                        <div>
                            <h4 class="font-extrabold text-slate-900 text-base">#0872 – Andi</h4>
                            <p class="text-xs font-semibold text-slate-400 mt-0.5">Prioritas (Sisa 2 Hari)</p>
                        </div>
                        <a href="pesanan.html" class="text-xs font-extrabold text-brand-yellowHover hover:underline">Cek</a>
                    </div>
                </div>
            </div>

        </div>
    </main>
</div>
</body></html>
